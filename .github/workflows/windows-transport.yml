name: Windows native transport
# Nightly on weekdays and on demand, never on a push or a pull request
# (owner decision, November 19, 2026). Changes are checked locally first by
# the pre-push hook in .githooks; this run is the safety net behind it, and
# a night when main has not moved since the last green run costs one short job.
on:
  schedule:
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quiet:
    # A scheduled run on a main that already passed is skipped; a dispatch always runs.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is unchanged since the last green nightly ($last)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  winhttp:
    needs: quiet
    if: needs.quiet.outputs.run == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LuaJIT/LuaJIT
          ref: dd3b24369ddfaa83c78cd6fdd91d157c8968ec8d
          path: .runtime/LuaJIT
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned official LuaJIT using installed MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation unavailable' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.runtime\LuaJIT\src'
          $batch = Join-Path $env:RUNNER_TEMP 'build-luajit.cmd'
          @"
          @echo off
          call "$vcvars" ${{ matrix.architecture }}
          if errorlevel 1 exit /b 1
          cd /d "$source"
          call msvcbuild.bat
          exit /b %errorlevel%
          "@ | Set-Content $batch
          & cmd.exe /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'LuaJIT source build failed' }
          & "$source\luajit.exe" -e "assert(jit.os == 'Windows'); assert(jit.arch == '${{ matrix.architecture }}'); print(jit.version, jit.arch)"
          if ($LASTEXITCODE -ne 0) { throw 'LuaJIT runtime unavailable' }
      - name: Run unit regressions
        shell: pwsh
        run: |
          & .\.runtime\LuaJIT\src\luajit.exe spec/run.lua
          if ($LASTEXITCODE -ne 0) { throw 'SDK unit regression failed' }
      - name: Exercise actual WinHTTP against loopback only
        shell: pwsh
        run: |
          $lua = Join-Path $env:GITHUB_WORKSPACE '.runtime\LuaJIT\src\luajit.exe'
          python spec/runtime/run.py --transport winhttp --lua $lua 2>&1 | Tee-Object winhttp-runtime.log
          if ($LASTEXITCODE -ne 0) { throw 'Native WinHTTP acceptance failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winhttp-${{ matrix.architecture }}
          path: winhttp-runtime.log
          if-no-files-found: ignore
